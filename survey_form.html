<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Survey Form</title>
    <h1 id = "title">Survey Form</h1>
    <p id = "description">This is a survey form</p>
  </head>

  <body>
    <form id = "survey-form">
      <label id = "name-label" for = "name">Name (required):</label>
      <input required id = "name" type = "text" placeholder = "John Doe"/>

      <label id = "email-label" for = "email">Email (required):</label>
      <input required id = "email" type = "email" placeholder = "example@email.com"/>

      <label id = "number-label" for = "number">Age:</label>
      <input id = "number" type = "number" min = "0" max = "100" placeholder = "42"/>


      <select id = "dropdown">
        <option>n/a</option>
        <option>Male</option>
        <option>Female</option>
      </select>

      <input type = "radio" name = "name" value = "Yes"/>
      <input type = "radio" name = "name" value = "No"/>

      <input type = "checkbox" name = "checkbox1" value = "British"/>
      <input type = "checkbox" name = "checkbox2" value = "Italian"/>  

      <textarea id = "textarea" value = "comments" >
        Hello this is placeholder text
      </textarea>

    <button id = "submit" type = "submit"></button>

    </form>

  </body>
</html>
